<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Tic Tac Toe | Richa</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="game-header">
            <h1 class="game-title">Tic Tac Toe</h1>
            <div class="score-board">
                <div class="score-player">
                    <span class="player-icon">❌</span>
                    <span class="score-label">Player X</span>
                    <span class="score-value" id="scoreX">0</span>
                </div>
                <div class="score-divider">VS</div>
                <div class="score-player">
                    <span class="player-icon">⭕</span>
                    <span class="score-label">Player O</span>
                    <span class="score-value" id="scoreO">0</span>
                </div>
            </div>
        </header>

        <div class="game-info">
            <div class="current-player" id="currentPlayer">
                Current Player: <span class="player-x">X</span>
            </div>
            <div class="game-status" id="gameStatus">Game On! 🚀</div>
        </div>

        <div class="game-board" id="gameBoard">
            <!-- Cells will be generated by JavaScript -->
        </div>

        <div class="game-controls">
            <button class="btn btn-reset" id="resetBtn">🔄 New Game</button>
            <button class="btn btn-theme" id="themeBtn">🌙 Dark Mode</button>
            <button class="btn btn-sound" id="soundBtn">🔊 Sound On</button>
        </div>

        <div class="winning-line" id="winningLine"></div>

        <!-- Confetti Celebration -->
        <canvas id="confettiCanvas"></canvas>
    </div>

    <footer class="game-footer">
        <p>Built with ❤️ by Richa</p>
    </footer>

    <!-- Audio Elements -->
    <audio id="clickSound" src="clicksound.wav"></audio>
    <audio id="winSound" src="winsound.mp3"></audio>
    <audio id="drawSound" src="losesound.wav"></audio>

    <script src="app.js"></script>
</body>
</html>
